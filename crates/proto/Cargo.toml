[package]
name = "zeron-proto"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Lets `HarnessId::Mock` run. Mock is a test harness, so it is off in shipped
# builds; test targets turn it on via dev-dependencies (see zeron-engine).
# The previous gate, `cfg!(debug_assertions)`, fails the release-profile test
# run, where assertions are off but the code is still under test.
mock-harness = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
pulldown-cmark.workspace = true
