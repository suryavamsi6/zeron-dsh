name: zgx tests

# Called by ci.yml (the `zgx` suite, scripts/ci/plan.py) when apps/zgx or a
# crate it or the engine's plugin host builds changes. zgx-beta.yml only builds.
#
#   apps/zgx's unit tests (`cargo test --bin zeron-zgx`: src/plugins/*_tests.rs
#   among them), its integration tests (`cargo test --test '*'`:
#   apps/zgx/tests/*.rs) and its Luau UI tests (`zgx test ui`, the zgx CLI at
#   the rev apps/zgx/Cargo.toml pins) — on Linux in their own `zgx-linux-ui`
#   job, on macOS in `zgx-macos` — the known failures let through
#   (scripts/ci/test-zgx.sh, scripts/ci/zgx-known-failures.txt);
#   and on macOS the engine's plugin tests (its lib's `plugins::` tests and
#   tests/plugin_services.rs), which core-tests runs on Linux.
#
# Not on Windows yet: zgx-beta.yml builds apps/zgx there, but its tests have
# never been run on Windows, so there's no known-failures list for it.
on:
  workflow_call:
    inputs:
      pass-key:
        description: Cache key prefix under which each job records its pass (ci.yml); empty records nothing.
        type: string
        default: ''
      skip:
        description: JSON list of jobs not to run (ci.yml; `zgx-macos` when a pull request leaves zgx itself alone).
        type: string
        default: '[]'

permissions:
  contents: read

env:
  NEXTEST_PROFILE: ${{ github.event_name == 'schedule' && 'default' || 'ci' }}
  CARGO_PROFILE_DEV_DEBUG: 0
  # The zgx CLI without Luau's asserts (they slow scripts by about a fifth).
  LUAU_CXXFLAGS: -DNDEBUG

jobs:
  zgx-macos:
    permissions:
      contents: read
      actions: write
      pull-requests: read  # first-red.sh compares the run's head with the PR's
    if: ${{ !contains(fromJSON(inputs.skip || '[]'), 'zgx-macos') }}
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup show active-toolchain || rustup toolchain install
      # zgx's terminals are Ghostty's on macOS, built with Zig 0.16 (zgx-ghostty-sys).
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
          # Its .zig-cache stays empty: zgx-ghostty-sys's build script runs
          # `zig build` with ZIG_GLOBAL_CACHE_DIR and ZIG_LOCAL_CACHE_DIR of
          # its own, both inside ~/Library/Caches/zgx-ghostty, so the restore
          # always missed and the post-step could only find the directory
          # absent. The zig work caches ride along in the Ghostty cache below
          # (the Zig tarball cache is unaffected by this).
          use-cache: false
      - id: zgx-ghostty
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/Library/Caches/zgx-ghostty
          key: zgx-ghostty-${{ hashFiles('apps/zgx/Cargo.lock') }}
          restore-keys: zgx-ghostty-
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: zgx-tests
          workspaces: |
            . -> target
            apps/zgx -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Install cargo-nextest
        run: |
          # macos.yml's: pinned release, verified against a checksum.
          version=0.9.146
          sha256=39785160b3c2f6ed9a765049cf4fa79f3b39aa02eb7598a5a0e2a1a0b9ffb9a8
          curl --proto '=https' --tlsv1.2 -fsSL --retry 5 -o "$RUNNER_TEMP/nextest.tar.gz" \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-$version/cargo-nextest-$version-universal-apple-darwin.tar.gz"
          echo "$sha256  $RUNNER_TEMP/nextest.tar.gz" | shasum -a 256 -c -
          bin="$RUNNER_TEMP/nextest-bin"
          mkdir -p "$bin"
          tar -xzf "$RUNNER_TEMP/nextest.tar.gz" -C "$bin" cargo-nextest
          echo "$bin" >> "$GITHUB_PATH"
      - id: zgx-rev
        name: The zgx rev apps/zgx pins
        run: echo "rev=$(sed -n 's/^zgx = .*rev = "\([0-9a-f]*\)".*/\1/p' apps/zgx/Cargo.toml)" >> "$GITHUB_OUTPUT"
      - id: zgx-cli
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/zgx-cli
          key: zgx-cli-${{ runner.os }}-${{ runner.arch }}-${{ steps.zgx-rev.outputs.rev }}
      - name: zgx CLI
        if: steps.zgx-cli.outputs.cache-hit != 'true'
        env:
          REV: ${{ steps.zgx-rev.outputs.rev }}
        run: |
          exec > >(tee -a "$RUNNER_TEMP/first-red.log") 2>&1
          echo 'first-red-step: zgx CLI'
          test -n "$REV"
          CARGO_TARGET_DIR="$RUNNER_TEMP/zgx-cli-target" cargo install --locked \
            --git https://github.com/zeronsh/zgx --rev "$REV" zgx-script --bin zgx --features inspect --root ~/zgx-cli
      # Saved here, not by the action's post-step: that one is skipped when a
      # later step fails, which is how this job rebuilt the CLI every run
      # (459 s) while it was red.
      - name: Save the zgx CLI
        if: steps.zgx-cli.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/zgx-cli
          key: zgx-cli-${{ runner.os }}-${{ runner.arch }}-${{ steps.zgx-rev.outputs.rev }}
      # exec+tee keeps the exit status while a copy lands in
      # $RUNNER_TEMP/first-red.log for the first-red excerpt (SUR-173).
      - name: apps/zgx unit tests
        run: |
          exec > >(tee -a "$RUNNER_TEMP/first-red.log") 2>&1
          echo 'first-red-step: apps/zgx unit tests'
          scripts/ci/test-zgx.sh rust
      # Saved here, not by the action's post-step: that one is skipped when a
      # later step fails — the same way this job rebuilt the zgx CLI every run
      # until its save moved in front of the tests. On a run where the build
      # script never ran (rust-cache's fingerprint still fresh) the directory
      # is absent and the save only warns; nothing is written.
      - name: Save the Ghostty build
        if: ${{ !cancelled() && steps.zgx-ghostty.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/Library/Caches/zgx-ghostty
          key: zgx-ghostty-${{ hashFiles('apps/zgx/Cargo.lock') }}
      # The Luau UI suite runs on Linux only: its layout is headless and
      # identical on both machines (measured 631 s vs 635 s; no font, DPI or
      # scrollbar difference in the path), and it was the step that kept this
      # job red on a rotating subset of the `transcript_return*` family. macOS
      # keeps the tests that need Metal.
      - name: apps/zgx integration tests
        if: ${{ !cancelled() }}
        run: |
          exec > >(tee -a "$RUNNER_TEMP/first-red.log") 2>&1
          echo 'first-red-step: apps/zgx integration tests'
          scripts/ci/test-zgx.sh tests
      - name: Engine plugin tests
        if: ${{ !cancelled() }}
        run: |
          exec > >(tee -a "$RUNNER_TEMP/first-red.log") 2>&1
          echo 'first-red-step: Engine plugin tests'
          cargo nextest run --config-file scripts/ci/nextest.toml --locked --no-fail-fast \
            -p zeron-engine --lib --test plugin_services \
            -E 'binary(plugin_services) | test(/plugins::/)'
      - name: Record the pass (CI skips this job while its inputs stay the same)
        if: inputs.pass-key != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: rust-toolchain.toml
          key: ${{ inputs.pass-key }}-zgx-macos
      # SUR-152/SUR-163/SUR-173: a red pull-request leg publishes the failed
      # step's name and a log excerpt — the annotation and the job summary —
      # then cancels the run only when the pull request's head has moved on:
      # a live head keeps the run and its evidence, anything unknown fails
      # safe. `scripts/ci/first-red.sh` reads the excerpt from
      # $RUNNER_TEMP/first-red.log, which the steps above tee into. The
      # fallback covers the script itself failing (a red checkout) with the
      # same head check; `|| true` keeps a failed publish or cancel from
      # masking this failure.
      - name: First red excerpt; cancel a superseded run
        if: failure() && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/ci/first-red.sh || {
            echo "::error title=First red::${GITHUB_JOB} failed"
            pr="$(jq -r '.pull_request.number // empty' "$GITHUB_EVENT_PATH" 2>/dev/null)"
            sha="$(jq -r '.pull_request.head.sha // empty' "$GITHUB_EVENT_PATH" 2>/dev/null)"
            live=""
            [ -n "$pr" ] && [ -n "$sha" ] &&
              live="$(gh api "repos/${{ github.repository }}/pulls/${pr}" --jq .head.sha 2>/dev/null)"
            [ -n "$live" ] && [ "$live" != "$sha" ] &&
              gh api --method POST "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel" || true
          }

  zgx-linux:
    permissions:
      contents: read
      actions: write
      pull-requests: read  # first-red.sh compares the run's head with the PR's
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # The unit tests run in two shards by measured duration (SUR-174): shard 1
    # the serialized repaint module, shard 2 everything else. The integration
    # tests stay on shard 1's runner so they still run exactly once.
    strategy:
      matrix:
        shard: [1, 2]
      fail-fast: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: System packages (zgx-beta.yml's)
        run: >-
          bash scripts/ci/apt-install.sh
          libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libxcb1-dev
          libx11-xcb-dev libfontconfig1-dev libfreetype-dev libasound2-dev libvulkan-dev
          pkg-config cmake libwebkit2gtk-4.1-dev libjson-glib-dev mold
          mesa-vulkan-drivers
      # (mesa-vulkan-drivers: lavapipe, a Vulkan device on the CPU, so agent
      # visuals' shaders and scenes render here as on a machine with a GPU;
      # src/visuals_tests.rs. The runner has none of its own.)
      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: zgx-tests
          workspaces: apps/zgx -> target
          # Both shards restore the same cache; only shard 1 saves it.
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.shard == 1 }}
          cache-on-failure: true
      - name: apps/zgx unit tests
        run: |
          exec > >(tee -a "$RUNNER_TEMP/first-red.log") 2>&1
          echo 'first-red-step: apps/zgx unit tests'
          scripts/ci/test-zgx.sh rust ${{ matrix.shard }}
      - name: apps/zgx integration tests
        if: ${{ !cancelled() && matrix.shard == 1 }}
        run: |
          exec > >(tee -a "$RUNNER_TEMP/first-red.log") 2>&1
          echo 'first-red-step: apps/zgx integration tests'
          scripts/ci/test-zgx.sh tests
      - name: Record the pass (CI skips this job while its inputs stay the same)
        if: inputs.pass-key != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: rust-toolchain.toml
          key: ${{ inputs.pass-key }}-zgx-linux-${{ matrix.shard }}
      # SUR-152/SUR-163/SUR-173: a red pull-request leg publishes the failed
      # step's name and a log excerpt — the annotation and the job summary —
      # then cancels the run only when the pull request's head has moved on:
      # a live head keeps the run and its evidence, anything unknown fails
      # safe. `scripts/ci/first-red.sh` reads the excerpt from
      # $RUNNER_TEMP/first-red.log, which the steps above tee into. The
      # fallback covers the script itself failing (a red checkout) with the
      # same head check; `|| true` keeps a failed publish or cancel from
      # masking this failure.
      - name: First red excerpt; cancel a superseded run
        if: failure() && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/ci/first-red.sh || {
            echo "::error title=First red::${GITHUB_JOB} failed"
            pr="$(jq -r '.pull_request.number // empty' "$GITHUB_EVENT_PATH" 2>/dev/null)"
            sha="$(jq -r '.pull_request.head.sha // empty' "$GITHUB_EVENT_PATH" 2>/dev/null)"
            live=""
            [ -n "$pr" ] && [ -n "$sha" ] &&
              live="$(gh api "repos/${{ github.repository }}/pulls/${pr}" --jq .head.sha 2>/dev/null)"
            [ -n "$live" ] && [ "$live" != "$sha" ] &&
              gh api --method POST "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel" || true
          }

  # The Luau UI suite needs nothing zgx-linux's Rust steps build — only the
  # cached zgx CLI — so it runs here, in parallel, instead of after them.
  # No Swatinem/rust-cache: this job never builds the app; the CLI's own
  # target dir is $RUNNER_TEMP, used only on a cache miss.
  zgx-linux-ui:
    permissions:
      contents: read
      actions: write
      pull-requests: read  # first-red.sh compares the run's head with the PR's
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: System packages (zgx-beta.yml's)
        run: >-
          bash scripts/ci/apt-install.sh
          libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libxcb1-dev
          libx11-xcb-dev libfontconfig1-dev libfreetype-dev libasound2-dev libvulkan-dev
          pkg-config cmake libwebkit2gtk-4.1-dev libjson-glib-dev mold
      # (No mesa-vulkan-drivers — zgx-linux's, for src/visuals_tests.rs's
      # paints on lavapipe. `zgx test ui` mounts the app headless: layout,
      # state and a frame clock, never a GPU device.)
      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - id: zgx-rev
        name: The zgx rev apps/zgx pins
        run: echo "rev=$(sed -n 's/^zgx = .*rev = "\([0-9a-f]*\)".*/\1/p' apps/zgx/Cargo.toml)" >> "$GITHUB_OUTPUT"
      - id: zgx-cli
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/zgx-cli
          key: zgx-cli-${{ runner.os }}-${{ runner.arch }}-${{ steps.zgx-rev.outputs.rev }}
      - name: zgx CLI
        if: steps.zgx-cli.outputs.cache-hit != 'true'
        env:
          REV: ${{ steps.zgx-rev.outputs.rev }}
        run: |
          exec > >(tee -a "$RUNNER_TEMP/first-red.log") 2>&1
          echo 'first-red-step: zgx CLI'
          test -n "$REV"
          CARGO_TARGET_DIR="$RUNNER_TEMP/zgx-cli-target" cargo install --locked \
            --git https://github.com/zeronsh/zgx --rev "$REV" zgx-script --bin zgx --features inspect --root ~/zgx-cli
      # Saved here, not by the action's post-step: that one is skipped when a
      # later step fails, which is how this job rebuilt the CLI every run
      # (459 s) while it was red.
      - name: Save the zgx CLI
        if: steps.zgx-cli.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/zgx-cli
          key: zgx-cli-${{ runner.os }}-${{ runner.arch }}-${{ steps.zgx-rev.outputs.rev }}
      - name: apps/zgx Luau UI tests
        if: ${{ !cancelled() }}
        run: |
          exec > >(tee -a "$RUNNER_TEMP/first-red.log") 2>&1
          echo 'first-red-step: apps/zgx Luau UI tests'
          scripts/ci/test-zgx.sh ui ~/zgx-cli/bin/zgx
      - name: Record the pass (CI skips this job while its inputs stay the same)
        if: inputs.pass-key != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: rust-toolchain.toml
          key: ${{ inputs.pass-key }}-zgx-linux-ui
      # SUR-152/SUR-163/SUR-173: a red pull-request leg publishes the failed
      # step's name and a log excerpt — the annotation and the job summary —
      # then cancels the run only when the pull request's head has moved on:
      # a live head keeps the run and its evidence, anything unknown fails
      # safe. `scripts/ci/first-red.sh` reads the excerpt from
      # $RUNNER_TEMP/first-red.log, which the steps above tee into. The
      # fallback covers the script itself failing (a red checkout) with the
      # same head check; `|| true` keeps a failed publish or cancel from
      # masking this failure.
      - name: First red excerpt; cancel a superseded run
        if: failure() && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/ci/first-red.sh || {
            echo "::error title=First red::${GITHUB_JOB} failed"
            pr="$(jq -r '.pull_request.number // empty' "$GITHUB_EVENT_PATH" 2>/dev/null)"
            sha="$(jq -r '.pull_request.head.sha // empty' "$GITHUB_EVENT_PATH" 2>/dev/null)"
            live=""
            [ -n "$pr" ] && [ -n "$sha" ] &&
              live="$(gh api "repos/${{ github.repository }}/pulls/${pr}" --jq .head.sha 2>/dev/null)"
            [ -n "$live" ] && [ "$live" != "$sha" ] &&
              gh api --method POST "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel" || true
          }
