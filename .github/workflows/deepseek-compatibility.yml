name: DeepSeek SDK compatibility
on:
  workflow_dispatch:
    inputs:
      rust-tests:
        type: boolean
        default: true
  workflow_call:
    inputs:
      pass-key:
        type: string
        default: ''
      rust-tests:
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  deepseek-compatibility:
    permissions:
      contents: read
      actions: write
      pull-requests: read  # first-red.sh compares the run's head with the PR's
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10
      # The sidecar is Rust, so the runtime test below needs the crate's
      # toolchain and cargo-nextest, not just Node.
      - uses: ./.github/actions/linux-ci
        with:
          rust-cache: deepseek-compatibility
      - name: Install the pinned official SDK
        run: |
          exec > >(tee -a "$RUNNER_TEMP/first-red.log") 2>&1
          echo 'first-red-step: Install the pinned official SDK'
          npm ci --prefix crates/harness/src/deepseek --ignore-scripts --no-audit --no-fund
      # The one end-to-end check that the sidecar and the pinned runtime still
      # agree on plan mode: `/plan off` on a resumed run has to leave the state
      # the model is told about. Loopback-only (a local mock model), so it needs
      # nothing outside the repo; named apart so a failure reads as a runtime/
      # sidecar disagreement rather than a suite failure.
      - name: The pinned runtime agrees with the sidecar on plan mode
        env:
          ZERON_DEEPSEEK_SDK_DIR: ${{ github.workspace }}/crates/harness/src/deepseek
        run: |
          exec > >(tee -a "$RUNNER_TEMP/first-red.log") 2>&1
          echo 'first-red-step: The pinned runtime agrees with the sidecar on plan mode'
          cargo nextest run --run-ignored ignored-only --locked -p zeron-harness -E 'test(sdk_runtime_round_trip_and_resume)'
      - name: Mock-backed SDK contract
        env:
          ZERON_DEEPSEEK_SDK_DIR: ${{ github.workspace }}/crates/harness/src/deepseek
        run: |
          exec > >(tee -a "$RUNNER_TEMP/first-red.log") 2>&1
          echo 'first-red-step: Mock-backed SDK contract'
          node --test crates/harness/tests/deepseek_sdk.test.mjs crates/harness/tests/deepseek_plugins.test.mjs crates/harness/tests/deepseek_chat_export.test.mjs
      # SUR-103: the bundle's own unit files, separate from the contract cases.
      # `NODE_PATH` is the peer anchor the runner has (the pinned SDK prefix
      # installed above), so a local `dsh` on PATH is not what makes this pass;
      # a missing bundle, peer or SDK fails here rather than skipping.
      # SUR-185: `node --test` exits 0 even when the glob matched nothing, so
      # the step's file guards and executed-count floor exist to keep a deleted
      # test file or a shrunken suite red rather than green.
      - name: The Captains plugin unit suite
        env:
          NODE_PATH: ${{ github.workspace }}/crates/harness/src/deepseek/node_modules
        run: |
          set -euo pipefail
          exec > >(tee -a "$RUNNER_TEMP/first-red.log") 2>&1
          echo 'first-red-step: The Captains plugin unit suite'
          for file in prompts.test.mjs tools.test.mjs crew.test.mjs; do
            if ! test -f "plugins/dsh-captains/test/$file"; then
              echo "missing plugin test file: $file" >&2
              exit 1
            fi
          done
          out=$(node --test plugins/dsh-captains/test/*.test.mjs 2>&1) || { printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out"
          # 34 is the reviewed passing count once crew.test.mjs covers the crew cases; lowering it is a deliberate change, and it counts `pass` rather than `tests` because a suite where every case is skipped still reports `tests 34` and exits 0.
          n=$(printf '%s\n' "$out" | sed -n 's/^[^ ]* pass \([0-9][0-9]*\)$/\1/p' | awk '{s+=$1} END {print s+0}')
          echo "plugin unit tests passing: $n"
          test "$n" -ge 34
      - name: Record the pass
        if: inputs.pass-key != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: rust-toolchain.toml
          key: ${{ inputs.pass-key }}-deepseek-compatibility
      # SUR-152/SUR-163/SUR-173: a red pull-request leg publishes the failed
      # step's name and a log excerpt — the annotation and the job summary —
      # then cancels the run only when the pull request's head has moved on:
      # a live head keeps the run and its evidence, anything unknown fails
      # safe. `scripts/ci/first-red.sh` reads the excerpt from
      # $RUNNER_TEMP/first-red.log, which the steps above tee into. The
      # fallback covers the script itself failing (a red checkout) with the
      # same head check; `|| true` keeps a failed publish or cancel from
      # masking this failure.
      - name: First red excerpt; cancel a superseded run
        if: failure() && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/ci/first-red.sh || {
            echo "::error title=First red::${GITHUB_JOB} failed"
            pr="$(jq -r '.pull_request.number // empty' "$GITHUB_EVENT_PATH" 2>/dev/null)"
            sha="$(jq -r '.pull_request.head.sha // empty' "$GITHUB_EVENT_PATH" 2>/dev/null)"
            live=""
            [ -n "$pr" ] && [ -n "$sha" ] &&
              live="$(gh api "repos/${{ github.repository }}/pulls/${pr}" --jq .head.sha 2>/dev/null)"
            [ -n "$live" ] && [ "$live" != "$sha" ] &&
              gh api --method POST "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel" || true
          }
  rust-tests:
    permissions:
      contents: read
      actions: write
      pull-requests: read  # first-red.sh compares the run's head with the PR's
    if: inputs.rust-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ./.github/actions/linux-ci
        with:
          rust-cache: core
      - name: Harness and engine tests
        run: |
          exec > >(tee -a "$RUNNER_TEMP/first-red.log") 2>&1
          echo 'first-red-step: Harness and engine tests'
          scripts/ci/test-core.sh
      # SUR-152/SUR-163/SUR-173: a red pull-request leg publishes the failed
      # step's name and a log excerpt — the annotation and the job summary —
      # then cancels the run only when the pull request's head has moved on:
      # a live head keeps the run and its evidence, anything unknown fails
      # safe. `scripts/ci/first-red.sh` reads the excerpt from
      # $RUNNER_TEMP/first-red.log, which the steps above tee into. The
      # fallback covers the script itself failing (a red checkout) with the
      # same head check; `|| true` keeps a failed publish or cancel from
      # masking this failure.
      - name: First red excerpt; cancel a superseded run
        if: failure() && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/ci/first-red.sh || {
            echo "::error title=First red::${GITHUB_JOB} failed"
            pr="$(jq -r '.pull_request.number // empty' "$GITHUB_EVENT_PATH" 2>/dev/null)"
            sha="$(jq -r '.pull_request.head.sha // empty' "$GITHUB_EVENT_PATH" 2>/dev/null)"
            live=""
            [ -n "$pr" ] && [ -n "$sha" ] &&
              live="$(gh api "repos/${{ github.repository }}/pulls/${pr}" --jq .head.sha 2>/dev/null)"
            [ -n "$live" ] && [ "$live" != "$sha" ] &&
              gh api --method POST "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel" || true
          }
