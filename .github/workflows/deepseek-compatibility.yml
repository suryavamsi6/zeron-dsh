name: DeepSeek SDK compatibility
on:
  workflow_dispatch:
    inputs:
      rust-tests:
        type: boolean
        default: true
  workflow_call:
    inputs:
      pass-key:
        type: string
        default: ''
      rust-tests:
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  deepseek-compatibility:
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10
      # The sidecar is Rust, so the runtime test below needs the crate's
      # toolchain and cargo-nextest, not just Node.
      - uses: ./.github/actions/linux-ci
        with:
          rust-cache: deepseek-compatibility
      - name: Install the pinned official SDK
        run: npm ci --prefix crates/harness/src/deepseek --ignore-scripts --no-audit --no-fund
      # The one end-to-end check that the sidecar and the pinned runtime still
      # agree on plan mode: `/plan off` on a resumed run has to leave the state
      # the model is told about. Loopback-only (a local mock model), so it needs
      # nothing outside the repo; named apart so a failure reads as a runtime/
      # sidecar disagreement rather than a suite failure.
      - name: The pinned runtime agrees with the sidecar on plan mode
        env:
          ZERON_DEEPSEEK_SDK_DIR: ${{ github.workspace }}/crates/harness/src/deepseek
        run: cargo nextest run --run-ignored ignored-only --locked -p zeron-harness -E 'test(sdk_runtime_round_trip_and_resume)'
      - name: Mock-backed SDK contract
        env:
          ZERON_DEEPSEEK_SDK_DIR: ${{ github.workspace }}/crates/harness/src/deepseek
        run: node --test crates/harness/tests/deepseek_sdk.test.mjs crates/harness/tests/deepseek_plugins.test.mjs crates/harness/tests/deepseek_chat_export.test.mjs
      - name: Record the pass
        if: inputs.pass-key != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: rust-toolchain.toml
          key: ${{ inputs.pass-key }}-deepseek-compatibility
      # SUR-152/SUR-163: a red pull-request leg cancels the run, so the legs
      # still running stop at once. The annotation names the failed step
      # before the cancel takes this job down; `scripts/ci/first-red.sh`
      # reads that step from the run's jobs. If the checkout itself is what
      # failed, the fallback below keeps the job-only annotation. `|| true`
      # keeps a failed cancel from masking this failure.
      - name: Cancel the run's other legs (SUR-152)
        if: failure() && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/ci/first-red.sh || {
            echo "::error title=First red::${GITHUB_JOB} failed; cancelling the rest of the run"
            gh api --method POST "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel" || true
          }
  rust-tests:
    permissions:
      contents: read
      actions: write
    if: inputs.rust-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ./.github/actions/linux-ci
        with:
          rust-cache: core
      - name: Harness and engine tests
        run: scripts/ci/test-core.sh
      # SUR-152/SUR-163: a red pull-request leg cancels the run, so the legs
      # still running stop at once. The annotation names the failed step
      # before the cancel takes this job down; `scripts/ci/first-red.sh`
      # reads that step from the run's jobs. If the checkout itself is what
      # failed, the fallback below keeps the job-only annotation. `|| true`
      # keeps a failed cancel from masking this failure.
      - name: Cancel the run's other legs (SUR-152)
        if: failure() && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/ci/first-red.sh || {
            echo "::error title=First red::${GITHUB_JOB} failed; cancelling the rest of the run"
            gh api --method POST "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel" || true
          }
