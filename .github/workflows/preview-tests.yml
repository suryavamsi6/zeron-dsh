name: Preview networking

# Called by ci.yml when edge/ changes. The Rust networking tests run in
# core-tests (ui-tests.yml, Linux) and macos-native (macos.yml); this keeps the
# edge coordinator and the credential vault (edge/vault, its own package), in
# one job: each takes seconds, a runner of its own cost more than the tests.
on:
  workflow_call:
    inputs:
      pass-key:
        description: Cache key prefix under which each job records its pass (ci.yml); empty records nothing.
        type: string
        default: ''

permissions:
  contents: read

jobs:
  edge:
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            edge/package-lock.json
            edge/vault/package-lock.json
      - name: Coordinator
        working-directory: edge
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: Credential vault
        if: ${{ !cancelled() }}
        working-directory: edge/vault
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: Record the pass (CI skips this job while its inputs stay the same)
        if: inputs.pass-key != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: rust-toolchain.toml
          key: ${{ inputs.pass-key }}-edge
      # SUR-152/SUR-163: a red pull-request leg cancels the run, so the legs
      # still running stop at once. The annotation names the failed step
      # before the cancel takes this job down; `scripts/ci/first-red.sh`
      # reads that step from the run's jobs. If the checkout itself is what
      # failed, the fallback below keeps the job-only annotation. `|| true`
      # keeps a failed cancel from masking this failure.
      - name: Cancel the run's other legs (SUR-152)
        if: failure() && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/ci/first-red.sh || {
            echo "::error title=First red::${GITHUB_JOB} failed; cancelling the rest of the run"
            gh api --method POST "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel" || true
          }
