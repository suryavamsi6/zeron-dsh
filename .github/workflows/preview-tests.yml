name: Preview networking

# Called by ci.yml when edge/ changes. The Rust networking tests run in
# core-tests (ui-tests.yml, Linux) and macos-native (macos.yml); this keeps the
# edge coordinator and the credential vault (edge/vault, its own package), in
# one job: each takes seconds, a runner of its own cost more than the tests.
on:
  workflow_call:
    inputs:
      pass-key:
        description: Cache key prefix under which each job records its pass (ci.yml); empty records nothing.
        type: string
        default: ''

permissions:
  contents: read

jobs:
  edge:
    permissions:
      contents: read
      actions: write
      pull-requests: read  # first-red.sh compares the run's head with the PR's
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            edge/package-lock.json
            edge/vault/package-lock.json
      # exec+tee keeps the exit status while a copy lands in
      # $RUNNER_TEMP/first-red.log for the first-red excerpt (SUR-173).
      - name: Coordinator
        working-directory: edge
        run: |
          exec > >(tee -a "$RUNNER_TEMP/first-red.log") 2>&1
          echo 'first-red-step: Coordinator'
          npm ci
          npm run typecheck
          npm test
      - name: Credential vault
        if: ${{ !cancelled() }}
        working-directory: edge/vault
        run: |
          exec > >(tee -a "$RUNNER_TEMP/first-red.log") 2>&1
          echo 'first-red-step: Credential vault'
          npm ci
          npm run typecheck
          npm test
      - name: Record the pass (CI skips this job while its inputs stay the same)
        if: inputs.pass-key != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: rust-toolchain.toml
          key: ${{ inputs.pass-key }}-edge
      # SUR-152/SUR-163/SUR-173: a red pull-request leg publishes the failed
      # step's name and a log excerpt — the annotation and the job summary —
      # then cancels the run only when the pull request's head has moved on:
      # a live head keeps the run and its evidence, anything unknown fails
      # safe. `scripts/ci/first-red.sh` reads the excerpt from
      # $RUNNER_TEMP/first-red.log, which the steps above tee into. The
      # fallback covers the script itself failing (a red checkout) with the
      # same head check; `|| true` keeps a failed publish or cancel from
      # masking this failure.
      - name: First red excerpt; cancel a superseded run
        if: failure() && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/ci/first-red.sh || {
            echo "::error title=First red::${GITHUB_JOB} failed"
            pr="$(jq -r '.pull_request.number // empty' "$GITHUB_EVENT_PATH" 2>/dev/null)"
            sha="$(jq -r '.pull_request.head.sha // empty' "$GITHUB_EVENT_PATH" 2>/dev/null)"
            live=""
            [ -n "$pr" ] && [ -n "$sha" ] &&
              live="$(gh api "repos/${{ github.repository }}/pulls/${pr}" --jq .head.sha 2>/dev/null)"
            [ -n "$live" ] && [ "$live" != "$sha" ] &&
              gh api --method POST "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel" || true
          }
