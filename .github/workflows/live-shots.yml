name: Live shots

# Offscreen pictures of the app's real screens, run on purpose.
#
# The screens are mounted headless by `audit_shots` (apps/zgx/src/audit_shots.rs)
# and drawn through zgx's own GPU renderer into PNGs, so a change can be shown
# as the interface actually draws it without a person opening the app. This is
# the evidence path for the roadmap's "live app verification" lines.
#
# Shot syntax (see audit_shots' module docs):
#   <fixture>                 ui/<fixture>_fixture.luau, or a name ending .luau
#   gallery:<page>            a gallery page
#   @<w>x<h>                  the size
#   #<target>                 crop to a node's box
#   !<command> =<state>:<json> ^<target> +<ms>   steps: click, state, wait
#   joined by `|`, the list by `,`
# Example: `shell,gallery:sidebar,settings_stub|^mcp@1240x820`
on:
  workflow_dispatch:
    inputs:
      shots:
        description: 'AUDIT_SHOTS list, comma separated'
        required: true
        default: 'shell'
      light:
        description: '1 for the light scheme (the fixtures default to dark)'
        required: false
        default: '0'
      confirm:
        description: 'Type RUN to confirm (this builds the app and takes 20+ minutes)'
        required: true
        default: ''

permissions:
  contents: read

jobs:
  shots:
    if: ${{ inputs.confirm == 'RUN' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Interface libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libssl-dev \
            libasound2-dev libudev-dev libxkbcommon-dev libsoup-3.0-dev \
            mesa-vulkan-drivers libgl1-mesa-dri xvfb x11-apps
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.8.3
        with:
          workspaces: '. -> target'
      - name: Build the app's test binary
        # (`apps/zgx` is its own workspace — `-p zeron-zgx` from the root finds
        # nothing, so every cargo call names its manifest and its target dir.)
        run: cargo test --locked --manifest-path apps/zgx/Cargo.toml --target-dir apps/zgx/target --bin zeron-zgx --no-run
      - name: Render the shots
        env:
          AUDIT_SHOTS: ${{ inputs.shots }}
          AUDIT_OUT: ${{ github.workspace }}/shots
          # The app reads `AUDIT_LIGHT` (its own module doc says `AUDIT_DARK`,
          # which nothing reads) and is dark unless it is set.
          WANT_LIGHT: ${{ inputs.light }}
        run: |
          if [ "$WANT_LIGHT" = "1" ]; then export AUDIT_LIGHT=1; fi
          mkdir -p shots
          xvfb-run -a cargo test --locked --manifest-path apps/zgx/Cargo.toml \
            --target-dir apps/zgx/target --bin zeron-zgx audit_shots -- --ignored --nocapture
      - name: What was produced
        if: always()
        run: |
          ls -la shots || true
          file shots/* 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: live-shots
          path: shots
          if-no-files-found: warn
