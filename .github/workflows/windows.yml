name: Windows tests

# Called by ci.yml (which decides when Windows runs and holds the runners for
# it, see scripts/ci/admit.py). Dispatch it by hand for a manual run.
on:
  workflow_call:
    inputs:
      pass-key:
        description: Cache key prefix under which each job records its pass (ci.yml); empty records nothing.
        type: string
        default: ''
      skip:
        description: JSON list of jobs that already passed on the same inputs (ci.yml skips them).
        type: string
        default: '[]'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

# Pull requests and main leave out slow and soak tests (scripts/ci/nextest.toml `ci` profile).
env:
  NEXTEST_PROFILE: ${{ github.event_name == 'schedule' && 'default' || 'ci' }}

jobs:
  # Every Windows crate suite in ONE build: separate `cargo test` invocations
  # with different package sets each recompiled the shared dependency graph
  # (they used to be three jobs, ~20 min each, almost all of it compiling).
  tests:
    permissions:
      contents: read
      actions: write
    if: ${{ !contains(fromJSON(inputs.skip || '[]'), 'tests') }}
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/windows-ci-setup
        with:
          save-rust-cache: 'true'
      - name: Build tests
        run: >-
          cargo nextest run --config-file scripts/ci/nextest.toml --no-run --release --locked
          -p zeron-harness -p zeron -p zeron-update -p zeron-proto -p zeron-engine
          --lib --bins
          --test background_engine --test noop_browser
          --test worktree_on_run --test auth
      # Same selection as before, minus the deleted GPUI app and its shader layout:
      #   harness SDK normalization and shared lifecycle tests
      #   application and updater, worktree paths, engine unit/catalog/login/auth
      - name: Harness, application, updater and engine tests
        env:
          RUST_BACKTRACE: '1'
        run: >-
          cargo nextest run --config-file scripts/ci/nextest.toml --release --locked --no-fail-fast
          -p zeron-harness -p zeron -p zeron-update -p zeron-proto -p zeron-engine
          --lib --bins
          --test background_engine --test noop_browser
          --test worktree_on_run --test auth
          -E "package(zeron-harness) | package(zeron) | package(zeron-update) | (package(zeron-proto) & test(device_paths)) | (package(zeron-engine) & (kind(lib) | binary_id(zeron-engine::auth) | (binary_id(zeron-engine::worktree_on_run) & test(worktree_location_))))"
      - name: Record the pass (CI skips this job while its inputs stay the same)
        if: inputs.pass-key != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: rust-toolchain.toml
          key: ${{ inputs.pass-key }}-tests

  # Restores the cache `tests` saves: the same dependencies, built with the same profile.
      # SUR-152: a red pull-request leg cancels the run, so the legs still
      # running stop at once instead of finishing for a verdict already known.
      # `|| true` keeps a failed cancel from masking this failure.
      - name: Cancel the run's other legs (SUR-152)
        if: failure() && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel" || true
  app:
    permissions:
      contents: read
      actions: write
    if: ${{ !contains(fromJSON(inputs.skip || '[]'), 'app') }}
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/windows-ci-setup
      - name: Build the zeron binary
        # (Luau without its asserts, as scripts/package-windows.ps1 builds it
        # next: the same flags, so it doesn't build it again.)
        env:
          LUAU_CXXFLAGS: -DNDEBUG
        run: cargo build --release --locked -p zeron
      - name: Verify portable and installer packaging
        run: ./scripts/package-windows.ps1 -ReleasesUrl "https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download"
      - name: Installer install/uninstall
        run: ./scripts/test-windows-installer.ps1
      - name: Build the desktop app
        # (The startup test checks its subsystem: `zeron-zgx.exe` is the
        # desktop app, `zeron.exe` the CLI beside it. Its own workspace, built
        # from its folder as scripts/package-windows.ps1 does.)
        env:
          LUAU_CXXFLAGS: -DNDEBUG
          # Keep `ort-sys`'s extracted DirectML runtime inside this job's temp
          # directory instead of the runner's shared cache (SUR-129).
          ORT_CACHE_DIR: ${{ runner.temp }}\ort-cache
        run: |
          # Cargo's build-dir layout v2 (default since Rust 1.100) nests build
          # script `OUT_DIR`s one level deeper. `ort-sys`'s `copy_dylibs` walks
          # three ancestors up from `OUT_DIR` to find the profile directory, so
          # it now lands in `target\release\build` instead of
          # `target\release`: it copies `DirectML.dll` into `build` and then
          # into `build\examples` and `build\deps`. Those two directories do
          # not exist on a cold cache, so the copy panics at
          # `dynamic_link.rs:42` (`Os { code: 3, NotFound }`, SUR-129). Create
          # them, so the copy always has a directory to land in.
          New-Item -ItemType Directory -Force -Path apps\zgx\target\release\build\examples, apps\zgx\target\release\build\deps | Out-Null
          Push-Location apps/zgx
          try {
            cargo build --release --locked --features beta --manifest-path Cargo.toml --target-dir target
          } finally { Pop-Location }
          # The same layout shift leaves the DLL one level down, in
          # `target\release\build`. Windows loads it from beside the
          # executable, which is where the pre-1.100 layout put it.
          Copy-Item -Force -ErrorAction SilentlyContinue apps\zgx\target\release\build\*.dll apps\zgx\target\release\
      - name: GUI subsystem and redirected CLI output
        run: ./scripts/test-windows-startup.ps1
      - name: CLI startup without HOME
        run: |
          # Exercise real path resolution without touching the runner's account.
          # Port zero cannot connect to another running engine.
          $env:HOME = $null
          $env:ZERON_DATA_DIR = $null
          $env:ZERON_EDGE_TOKEN = $null
          $env:ZERON_IPC_PORT = '0'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "zeron smoke O'Brien 日本語"
          $expected = Join-Path $env:LOCALAPPDATA 'Zeron'
          $probe = [Diagnostics.ProcessStartInfo]::new()
          $probe.FileName = (Resolve-Path -LiteralPath './target/release/zeron.exe').Path
          $probe.Arguments = 'status'
          $probe.UseShellExecute = $false
          $probe.CreateNoWindow = $true
          $probe.RedirectStandardOutput = $true
          $probe.RedirectStandardError = $true
          $process = [Diagnostics.Process]::Start($probe)
          try {
            $stdout = $process.StandardOutput.ReadToEndAsync()
            $stderr = $process.StandardError.ReadToEndAsync()
            if (-not $process.WaitForExit(10000)) {
              $process.Kill()
              throw 'Isolated status probe timed out'
            }
            if ($process.ExitCode -ne 0) { throw "Status failed: $($stderr.Result)" }
            $output = $stdout.Result -split '\r?\n'
          } finally { $process.Dispose() }
          $output
          if (-not ($output -contains "Data dir: $expected")) {
            throw 'Windows startup did not select LOCALAPPDATA/Zeron'
          }
          if (-not ($output -match '^Mode:\s+local only$')) {
            throw 'An isolated Windows startup must select local-only mode'
          }
      - name: Record the pass (CI skips this job while its inputs stay the same)
        if: inputs.pass-key != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: rust-toolchain.toml
          key: ${{ inputs.pass-key }}-app
      # SUR-152: a red pull-request leg cancels the run, so the legs still
      # running stop at once instead of finishing for a verdict already known.
      # `|| true` keeps a failed cancel from masking this failure.
      - name: Cancel the run's other legs (SUR-152)
        if: failure() && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel" || true
