name: Linux installer

# Called by ci.yml when the installers or the desktop entry change.
on:
  workflow_call:
    inputs:
      pass-key:
        description: Cache key prefix under which each job records its pass (ci.yml); empty records nothing.
        type: string
        default: ''

permissions:
  contents: read

jobs:
  desktop-entry:
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Desktop entry validator
        # Skips apt when the runner image already has it; otherwise the install
        # retries and is bounded instead of hanging on a stalled mirror.
        run: command -v desktop-file-validate || bash scripts/ci/apt-install.sh desktop-file-utils
      # Both installers, offline, under a throwaway HOME (no network, no systemd).
      - name: Installers write a valid launcher entry
        run: scripts/test-linux-desktop-entry.sh
      - name: Record the pass (CI skips this job while its inputs stay the same)
        if: inputs.pass-key != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: rust-toolchain.toml
          key: ${{ inputs.pass-key }}-desktop-entry
      # SUR-152: a red pull-request leg cancels the run, so the legs still
      # running stop at once instead of finishing for a verdict already known.
      # `|| true` keeps a failed cancel from masking this failure.
      - name: Cancel the run's other legs (SUR-152)
        if: failure() && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel" || true
