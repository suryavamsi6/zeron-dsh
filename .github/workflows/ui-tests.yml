name: Linux tests

# Called by ci.yml, which decides which of these run and holds the runners for
# them (scripts/ci/plan.py, scripts/ci/admit.py).
on:
  workflow_call:
    inputs:
      pass-key:
        description: Cache key prefix under which each job records its pass (ci.yml); empty records nothing.
        type: string
        default: ''
      core:
        type: boolean
        default: true

permissions:
  contents: read

# Pull requests and main leave out the slow and soak tests (scripts/ci/nextest.toml
# `ci` profile); the nightly run (schedule) runs everything in full.
env:
  NEXTEST_PROFILE: ${{ github.event_name == 'schedule' && 'default' || 'ci' }}

jobs:
  # Every Linux Rust test that is not UI: one build, one nextest run (see
  # scripts/ci/test-core.sh) split into two nextest partitions that run side by
  # side (scripts/ci/plan.py counts both runners and skips both passes
  # together). Both shards build the same graph; both restore the core cache,
  # and only shard 1 saves it. Including the voice protocol and transport tests
  # that need no audio stack.
  core-tests:
    permissions:
      contents: read
      actions: write
      pull-requests: read  # first-red.sh compares the run's head with the PR's
    if: inputs.core
    strategy:
      matrix:
        shard: [1, 2]
      fail-fast: false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/linux-ci
        with:
          rust-cache: core
          save-rust-cache: ${{ matrix.shard == 1 && 'true' || 'false' }}
      - name: Harness, engine, sync, update, doc, preview, MCP and voice protocol tests
        # exec+tee keeps the exit status while a copy lands in
        # $RUNNER_TEMP/first-red.log for the first-red excerpt (SUR-173).
        run: |
          exec > >(tee -a "$RUNNER_TEMP/first-red.log") 2>&1
          echo 'first-red-step: Harness, engine, sync, update, doc, preview, MCP and voice protocol tests'
          scripts/ci/test-core.sh --partition hash:${{ matrix.shard }}/2
      - name: Record the pass (CI skips this job while its inputs stay the same)
        if: inputs.pass-key != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: rust-toolchain.toml
          key: ${{ inputs.pass-key }}-core-tests-${{ matrix.shard }}
      # SUR-152/SUR-163/SUR-173: a red pull-request leg publishes the failed
      # step's name and a log excerpt — the annotation and the job summary —
      # then cancels the run only when the pull request's head has moved on:
      # a live head keeps the run and its evidence, anything unknown fails
      # safe. `scripts/ci/first-red.sh` reads the excerpt from
      # $RUNNER_TEMP/first-red.log, which the steps above tee into. The
      # fallback covers the script itself failing (a red checkout) with the
      # same head check; `|| true` keeps a failed publish or cancel from
      # masking this failure.
      - name: First red excerpt; cancel a superseded run
        if: failure() && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/ci/first-red.sh || {
            echo "::error title=First red::${GITHUB_JOB} failed"
            pr="$(jq -r '.pull_request.number // empty' "$GITHUB_EVENT_PATH" 2>/dev/null)"
            sha="$(jq -r '.pull_request.head.sha // empty' "$GITHUB_EVENT_PATH" 2>/dev/null)"
            live=""
            [ -n "$pr" ] && [ -n "$sha" ] &&
              live="$(gh api "repos/${{ github.repository }}/pulls/${pr}" --jq .head.sha 2>/dev/null)"
            [ -n "$live" ] && [ "$live" != "$sha" ] &&
              gh api --method POST "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel" || true
          }

