# Linux targets link through .cargo/cc-mold.sh: with mold installed (apt/dnf/
# pacman: mold) the final link of the big test binaries is several times
# faster; without it the script is exactly the default `cc`. The path is
# relative to the workspace root, where cargo runs rustc; apps/zgx (its own
# workspace) repeats it in its own .cargo/config.toml.
[target.x86_64-unknown-linux-gnu]
linker = ".cargo/cc-mold.sh"

[target.aarch64-unknown-linux-gnu]
linker = ".cargo/cc-mold.sh"
